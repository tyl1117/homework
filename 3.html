<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
           margin: auto;
           border-collapse: collapse; 
        }
        td{
            border: 1px solid;
            text-align: center;
            width:  100px;
            height: 100px;
        }
        tr:nth-child(odd) :nth-child(even){
            background-color: cornsilk;
            
        }
        tr:nth-child(even) td:nth-child(odd){
            background-color: cornsilk;
        }
        tr:nth-child(odd) td:nth-child(even):hover{
            background-color: rgb(237, 192, 11);
            
        }
        tr:nth-child(even) td:nth-child(odd):hover{
            background-color: rgb(241, 196, 16);
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>ttt</td>
            <td>ttt</td>
            <td>ttt</td>
        </tr>
        <tr>
            <td>ttt</td>
            <td>ttt</td>
            <td>ttt</td>
        </tr>
        <tr>
            <td>ttt</td>
            <td>ttt</td>
            <td>ttt</td>
        </tr>
    </table>
</body>
</html>
